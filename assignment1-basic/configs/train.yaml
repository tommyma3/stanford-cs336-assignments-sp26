model:
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_feedforward: 1344
  device: cuda:6
  dtype: bfloat16

optimizer:
  name: AdamW
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  weight_decay: 0.01

data:
  train: data/TinyStories-train.txt
  eval: data/TinyStoriesV2-GPT4-valid.txt

tokenizer:
  vocab_filepath: artifacts/tinystories_tokenizer/vocab.pkl
  merges_filepath: artifacts/tinystories_tokenizer/merges.pkl
  special_tokens:
    - "<|endoftext|>"
  

training:
  iterations: 50000
  batch_size: 64
  max_lr: 3e-4
  min_lr: 1e-5
  warmup_iters: 5000
  cosine_cycle_iters: 40000
  checkpoint_interval: 10000
  eval_interval: 1000
  log_interval: 100
  ckpt_dir: artifacts/train
  max_l2_norm: 1.0
