model:
  context_length: 4096
  d_model: 256
  num_layers: 4
  num_heads: 4
  d_feedforward: null
  device: cuda
  dtype: bfloat16

optimizer:
  name: AdamW
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  weight_decay: 0.01

data:
  train: data/owt_train.txt
  eval: data/owt_valid.txt

tokenizer:
  vocab_filepath: artifacts/owt_tokenizer/vocab.pkl
  merges_filepath: artifacts/owt_tokenizer/merges.pkl
  special_tokens:
    - "<|endoftext|>"
  

training:
  iterations: 50000
  batch_size: 256
  max_lr: 3e-4
  min_lr: 1e-5
  warmup_iters: 5000
  cosine_cycle_iters: 40000
  checkpoint_interval: 10000
  eval_interval: 1000
  log_interval: 100
  ckpt_dir: artifacts/train
  max_l2_norm: 1.0
